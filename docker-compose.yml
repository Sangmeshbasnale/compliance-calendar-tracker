# =============================================================================
#  Compliance Calendar Tracker — Docker Compose
#  Services: postgres | redis | backend (Spring Boot) | ai-service (Flask) | frontend (React/nginx)
#  Usage:
#    docker compose up -d          # start all
#    docker compose up -d backend  # start one service + its dependencies
#    docker compose logs -f        # follow all logs
#    docker compose down -v        # stop and remove volumes
# =============================================================================

name: compliance-tracker

# ---------------------------------------------------------------------------
# Shared defaults applied to every service via YAML anchors
# ---------------------------------------------------------------------------
x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ---------------------------------------------------------------------------
services:

  # ── 1. PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    <<: [*restart-policy, *default-logging]
    image: postgres:16-alpine
    container_name: compliance_postgres
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-compliance_db}
      POSTGRES_USER:     ${POSTGRES_USER:-compliance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance_user} -d ${POSTGRES_DB:-compliance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-net

  # ── 2. Redis ───────────────────────────────────────────────────────────────
  redis:
    <<: [*restart-policy, *default-logging]
    image: redis:7-alpine
    container_name: compliance_redis
    env_file: .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net

  # ── 3. Spring Boot Backend ────────────────────────────────────────────────
  backend:
    <<: [*restart-policy, *default-logging]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance_backend
    env_file: .env
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # Database — uses Docker service name "postgres" as hostname
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-compliance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-compliance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Redis — uses Docker service name "redis" as hostname
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Mail (SMTP)
      SPRING_MAIL_HOST:     ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT:     ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:            "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      APP_MAIL_FROM:  ${APP_MAIL_FROM}
      APP_MAIL_ADMIN: ${APP_MAIL_ADMIN}

      # AI service internal URL (Docker network hostname)
      AI_SERVICE_URL: http://ai-service:5000

      # Actuator — exposes /actuator/health used by the health check
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s          # allow JVM + Flyway migrations to finish
    networks:
      - backend-net
      - frontend-net

  # ── 4. Flask AI Service ───────────────────────────────────────────────────
  ai-service:
    <<: [*restart-policy, *default-logging]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: compliance_ai
    env_file: .env
    environment:
      # Internal URL of the Spring Boot backend
      BACKEND_URL: http://backend:8080

      # Flask / Gunicorn tuning
      PORT:        5000
      WORKERS:     ${AI_WORKERS:-2}
      LOG_LEVEL:   ${AI_LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health | grep -q 'UP' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net
      - frontend-net

  # ── 5. React Frontend (nginx) ─────────────────────────────────────────────
  frontend:
    <<: [*restart-policy, *default-logging]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passed as build-time ARGs so Vite can bake them into the JS bundle
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_AI_URL:  ${VITE_AI_URL:-http://localhost:5000}
    container_name: compliance_frontend
    environment:
      # Runtime env (informational — nginx serves static files)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_AI_URL:  ${VITE_AI_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend-net

# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Two networks keep the database/cache invisible to the public-facing frontend
networks:
  backend-net:          # postgres, redis, backend, ai-service
    driver: bridge
  frontend-net:         # frontend → backend, frontend → ai-service
    driver: bridge
